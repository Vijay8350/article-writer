<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfbfd" />
  <meta name="color-scheme" content="light dark" />
  <!-- Appearance (light / dark / system) is applied before the app renders, so it never flashes -->
  <script>(function(){try{var p=localStorage.getItem("aw_theme");var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content","#000000");}else{document.documentElement.setAttribute("data-theme","light");}}catch(e){}})();</script>

  <!-- Default robots: noindex by default; public pages re-enable indexing via <Seo />. -->
  <meta name="robots" content="noindex, nofollow" />

  <title>Glowquill Article Writer — AI Blog &amp; SEO for Shopify</title>
  <meta name="description" content="Glowquill — AI article writer &amp; SEO for Shopify. Generates SEO articles with your real product images and publishes them to your blog — instantly or on a schedule." />

  <!-- Favicons / PWA -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Open Graph defaults (per-page overrides via <Seo />) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Glowquill Article Writer" />
  <meta property="og:title" content="Glowquill Article Writer — AI Blog &amp; SEO for Shopify" />
  <meta property="og:description" content="AI blog writer for Shopify stores. SEO articles with your real product images, published automatically." />
  <meta property="og:url" content="https://tools.apanjob.com/" />
  <meta property="og:image" content="https://tools.apanjob.com/icon-512.png" />

  <!-- Twitter Card defaults -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Glowquill Article Writer — AI Blog &amp; SEO for Shopify" />
  <meta name="twitter:description" content="AI blog writer for Shopify stores. SEO articles with your real product images, published automatically." />
  <meta name="twitter:image" content="https://tools.apanjob.com/icon-512.png" />

  <!-- Resource hints + font (font-display:swap is in the CSS file URL) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Site-wide structured data: Organization + WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://tools.apanjob.com/#org",
        "name": "Glowquill",
        "url": "https://tools.apanjob.com/",
        "logo": "https://tools.apanjob.com/icon-512.png"
      },
      {
        "@type": "WebSite",
        "@id": "https://tools.apanjob.com/#website",
        "url": "https://tools.apanjob.com/",
        "name": "Glowquill Article Writer",
        "publisher": { "@id": "https://tools.apanjob.com/#org" }
      }
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
