# /etc/nginx/sites-available/article-writer
#
# gzip is ALREADY enabled globally in Ubuntu's /etc/nginx/nginx.conf.
# Redefining `gzip on;` (or any gzip_* directive) here causes a duplicate-
# directive error and Nginx will refuse to start. Don't add gzip_* here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Increase request size for article generation
    client_max_body_size 10M;

    # ─── Security headers (apply to every response) ───
    # HSTS is only meaningful once SSL is in place; safe to send now (browsers
    # only honor it on HTTPS). Re-evaluate `preload` once you're ready to commit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Serve frontend (Vite build output)
    root /home/ubuntu/Article_Writer/frontend/dist;
    index index.html;

    # robots.txt + sitemap.xml + manifest — short cache so updates show fast
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sitemap.xml       { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback — all non-asset routes to index.html. HTML is NOT cached long
    # so users see new deploys immediately.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Long timeout for AI generation (5 minutes)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Hashed Vite assets — immutable, cache for 1 year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Other static assets (favicons, fonts, images at the root)
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
