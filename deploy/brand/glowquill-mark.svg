<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Glowquill mark (64-unit grid). The App Store icon (glowquill-icon-1200.png) is this artwork full-bleed: square background without corner radius, feather scaled 0.84 about its centre. Colours: deep #073b8f to cobalt #0b63ce, glow #8fcaff, shaded half #d4e7ff. -->
