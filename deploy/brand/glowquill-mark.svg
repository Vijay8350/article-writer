    <linearGradient id="gq-bg" x1="10" y1="62" x2="54" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#073b8f"/>
      <stop offset="1" stop-color="#0b63ce"/>
    </linearGradient>
    <radialGradient id="gq-glow" cx="36" cy="27" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fcaff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#5aa8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f80ed" stop-opacity="0"/>
    </radialGradient>
    <filter id="gq-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <clipPath id="gq-tile"><rect width="64" height="64" rx="14.5"/></clipPath>
